spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: 
  sql:
    init:
      mode: always
      # 必须显式 UTF-8：否则 H2 以平台默认字符集（本机为 GBK）读取 UTF-8 脚本，
      # 种子里的中文会读成「寮犲悓瀛」这类乱码（与 application-local.yml 同一处修复）。
      encoding: UTF-8
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql

# 针对单元测试禁用真实 Redis
app:
  security:
    max-failed-attempts-for-captcha: 3
