spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding 必须是 Java 字符集名（UTF-8），写 utf8mb4 会让 Connector/J 抛
    # UnsupportedEncodingException；库/表侧仍是 utf8mb4（见 sql/schema.sql）
    url: jdbc:mysql://localhost:3306/campus_repair?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: rootpassword
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.campus.repair: DEBUG
    org.springframework.security: INFO
