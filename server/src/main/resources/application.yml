server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: campus-repair-server
  profiles:
    # 默认 local（内存 H2 + 无外置依赖，开箱即用）；生产用 SPRING_PROFILES_ACTIVE=dev 覆盖即可
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# JWT 配置：生产环境必须通过 JWT_SECRET 环境变量注入独立密钥；内置默认值仅供本地开发/测试（使用时启动会 WARN）
jwt:
  secret: ${JWT_SECRET:CampusRepairSystemSuperSecureSecretKeyForJjwtVerification2026!#}
  access-token-expiration-seconds: 7200 # 2小时
  refresh-token-expiration-seconds: 604800 # 7天

# 系统业务参数默认值
app:
  cors:
    # 跨域白名单：逗号分隔的精确来源（非通配符）；生产部署通过 APP_CORS_ALLOWED_ORIGINS 覆盖为实际域名
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    max-failed-attempts-for-captcha: 3
  file:
    upload-dir: ./uploads/
    max-size-mb: 10
  assistant:
    # 智能助手的大模型增强（**双层开关的第一层**：能力是否就绪）。
    # 必须同时满足：本层 enabled+三项配置齐全 **且** sys_config.assistant_llm_enabled=1。
    # 默认全关 ⇒ 助手用本地规则引擎，零外部依赖、离线可用。
    # 密钥只从环境变量注入，不落库、不进日志。
    llm:
      enabled: ${ASSISTANT_LLM_ENABLED:false}
      base-url: ${ASSISTANT_LLM_BASE_URL:}
      api-key: ${ASSISTANT_LLM_API_KEY:}
      model: ${ASSISTANT_LLM_MODEL:}
      # 连接与读取超时：超时即降级为纯规则，绝不拖住提单页。
      # 默认 8000（2026-09-26 由 3000 上调）：接思考模型实测延迟 1.8~4.9s，
      # 3000ms 会打掉将近一半请求（degradedReason=LLM_TIMEOUT）。快模型可下调。
      timeout-ms: ${ASSISTANT_LLM_TIMEOUT_MS:8000}
      # 生成上限。**思考模型的推理 token 也占这个额度**，太小会把 content 挤空
      # （表现为 degradedReason=LLM_INVALID_RESPONSE）。
      # 默认 512（2026-09-26 由 64 上调）：实测 64 时 7 条描述错 3 条、512 级别 0 条。
      # 这是**上限不是预留**，对不推理的模型零成本。
      max-tokens: ${ASSISTANT_LLM_MAX_TOKENS:512}
