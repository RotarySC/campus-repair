server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: campus-repair-server
  profiles:
    # 默认 local（内存 H2 + 无外置依赖，开箱即用）；生产用 SPRING_PROFILES_ACTIVE=dev 覆盖即可
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# JWT 配置：生产环境必须通过 JWT_SECRET 环境变量注入独立密钥；内置默认值仅供本地开发/测试（使用时启动会 WARN）
jwt:
  secret: ${JWT_SECRET:CampusRepairSystemSuperSecureSecretKeyForJjwtVerification2026!#}
  access-token-expiration-seconds: 7200 # 2小时
  refresh-token-expiration-seconds: 604800 # 7天

# 系统业务参数默认值
app:
  cors:
    # 跨域白名单：逗号分隔的精确来源（非通配符）；生产部署通过 APP_CORS_ALLOWED_ORIGINS 覆盖为实际域名
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    max-failed-attempts-for-captcha: 3
  file:
    upload-dir: ./uploads/
    max-size-mb: 10
